<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Uzbek</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #070812;
    --panel: rgba(18, 20, 38, .78);
    --panel2: rgba(27, 30, 53, .72);
    --text: #f4f6ff;
    --muted: #9298b8;
    --accent: #7c5cff;
    --accent2: #00e5ff;
    --green: #35e58c;
    --red: #ff5577;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 15% 10%, rgba(124,92,255,.20), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(0,229,255,.13), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    overflow-x: hidden;
}

/* BACKGROUND */

.bg {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: -1;
}

.blob {
    position: absolute;
    width: 280px;
    height: 280px;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .20;
    animation: float 10s ease-in-out infinite;
}

.blob.one {
    background: #7c5cff;
    left: -100px;
    top: 30%;
}

.blob.two {
    background: #00e5ff;
    right: -100px;
    top: 60%;
    animation-delay: -4s;
}

@keyframes float {
    0%,100% {
        transform: translate(0,0) scale(1);
    }
    50% {
        transform: translate(40px,-50px) scale(1.2);
    }
}

/* APP */

.app {
    width: min(1100px, 100%);
    min-height: 100vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    padding: 18px;
}

/* HEADER */

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 15px 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(12,14,28,.72);
    backdrop-filter: blur(20px);
    border-radius: 22px;
    box-shadow: 0 15px 60px rgba(0,0,0,.3);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logoIcon {
    width: 45px;
    height: 45px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow:
        0 0 25px rgba(124,92,255,.35),
        inset 0 0 15px rgba(255,255,255,.15);
    animation: pulse 3s infinite;
}

@keyframes pulse {
    0%,100% {
        box-shadow: 0 0 20px rgba(124,92,255,.25);
    }
    50% {
        box-shadow: 0 0 35px rgba(0,229,255,.45);
    }
}

.logoText h1 {
    font-size: 18px;
}

.logoText span {
    color: var(--muted);
    font-size: 12px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 13px;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
}

.dot.online {
    background: var(--green);
    box-shadow: 0 0 12px var(--green);
}

/* SETUP */

.setup {
    margin-top: 18px;
    padding: 18px;
    border-radius: 22px;
    background: var(--panel);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    animation: appear .5s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.setupTitle {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
}

.setupTitle strong {
    font-size: 14px;
}

.setupTitle small {
    color: var(--muted);
}

.inputRow {
    display: flex;
    gap: 10px;
}

input {
    width: 100%;
    border: none;
    outline: none;
    color: white;
    background: rgba(0,0,0,.28);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 14px;
    padding: 14px;
    font-size: 14px;
}

input:focus {
    border-color: rgba(124,92,255,.7);
    box-shadow: 0 0 20px rgba(124,92,255,.12);
}

button {
    border: none;
    cursor: pointer;
    color: white;
    transition: .2s;
}

.testBtn {
    min-width: 110px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #5e8cff);
    font-weight: 700;
}

.testBtn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(124,92,255,.3);
}

.hint {
    margin-top: 9px;
    color: var(--muted);
    font-size: 11px;
}

/* CHAT */

.chat {
    flex: 1;
    min-height: 400px;
    margin-top: 18px;
    padding: 20px;
    border-radius: 25px;
    background: rgba(10,12,25,.65);
    border: 1px solid rgba(255,255,255,.07);
    backdrop-filter: blur(18px);
    overflow-y: auto;
}

.welcome {
    height: 100%;
    min-height: 400px;
    display: grid;
    place-items: center;
    text-align: center;
    color: var(--muted);
}

.welcomeIcon {
    font-size: 55px;
    margin-bottom: 15px;
    animation: floatIcon 3s ease-in-out infinite;
}

@keyframes floatIcon {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
}

.welcome h2 {
    color: white;
    margin-bottom: 8px;
}

.message {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: messageIn .3s ease;
}

@keyframes messageIn {
    from {
        opacity: 0;
        transform: translateY(10px) scale(.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.message.user {
    justify-content: flex-end;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg,#282b48,#181a2c);
}

.message.user .avatar {
    order: 2;
    background: linear-gradient(135deg,var(--accent),#526dff);
}

.bubble {
    max-width: 80%;
    padding: 13px 16px;
    border-radius: 18px;
    line-height: 1.5;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    background: var(--panel2);
    border: 1px solid rgba(255,255,255,.06);
}

.message.user .bubble {
    background: linear-gradient(
        135deg,
        rgba(124,92,255,.35),
        rgba(82,109,255,.25)
    );
}

/* TYPING */

.typing {
    display: flex;
    gap: 5px;
    align-items: center;
}

.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent2);
    animation: typing 1s infinite;
}

.typing span:nth-child(2) {
    animation-delay: .15s;
}

.typing span:nth-child(3) {
    animation-delay: .3s;
}

@keyframes typing {
    0%,60%,100% {
        transform: translateY(0);
        opacity: .4;
    }
    30% {
        transform: translateY(-5px);
        opacity: 1;
    }
}

/* BOTTOM */

.bottom {
    margin-top: 18px;
    display: flex;
    gap: 10px;
    padding: 12px;
    border-radius: 20px;
    background: rgba(15,17,32,.82);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
}

.messageInput {
    flex: 1;
}

.send {
    width: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg,var(--accent),#4f8cff);
    font-size: 19px;
}

.send:active {
    transform: scale(.92);
}

.clear {
    width: 45px;
    border-radius: 14px;
    background: rgba(255,255,255,.06);
}

.clear:hover {
    background: rgba(255,255,255,.12);
}

/* ERROR */

.error {
    color: #ff819a;
    background: rgba(255,60,90,.08);
    border: 1px solid rgba(255,60,90,.18);
    padding: 12px;
    border-radius: 13px;
    margin-top: 10px;
    font-size: 12px;
}

/* MOBILE */

@media(max-width:600px) {

    .app {
        padding: 10px;
    }

    .header {
        border-radius: 18px;
    }

    .setup {
        border-radius: 18px;
    }

    .inputRow {
        flex-direction: column;
    }

    .testBtn {
        height: 46px;
    }

    .chat {
        padding: 14px;
        border-radius: 19px;
    }

    .bubble {
        max-width: 88%;
    }

    .bottom {
        border-radius: 18px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="blob one"></div>
    <div class="blob two"></div>
</div>

<div class="app">

    <header class="header">

        <div class="logo">

            <div class="logoIcon">
                ✦
            </div>

            <div class="logoText">
                <h1>Gemini AI Lab</h1>
                <span>API Connection Tester</span>
            </div>

        </div>

        <div class="status">
            <div id="statusDot" class="dot"></div>
            <span id="statusText">Не подключено</span>
        </div>

    </header>


    <section class="setup">

        <div class="setupTitle">
            <strong>🔑 Gemini API Key</strong>
            <small>Тестовый режим</small>
        </div>

        <div class="inputRow">

            <input
                id="apiKey"
                type="password"
                placeholder="Вставь сюда Gemini API Key..."
                autocomplete="off"
            >

            <button
                class="testBtn"
                onclick="testConnection()">
                Проверить
            </button>

        </div>

        <div class="hint">
            Ключ используется только в этом браузере и не сохраняется.
        </div>

        <div id="errorBox"></div>

    </section>


    <main id="chat" class="chat">

        <div class="welcome" id="welcome">

            <div>

                <div class="welcomeIcon">
                    ✨
                </div>

                <h2>Gemini готов к тесту</h2>

                <p>
                    Вставь API-ключ сверху<br>
                    и напиши первое сообщение.
                </p>

            </div>

        </div>

    </main>


    <div class="bottom">

        <input
            id="messageInput"
            class="messageInput"
            placeholder="Напиши сообщение..."
            onkeydown="handleEnter(event)"
        >

        <button
            class="clear"
            onclick="clearChat()"
            title="Очистить">
            ↻
        </button>

        <button
            class="send"
            onclick="sendMessage()"
            title="Отправить">
            ➤
        </button>

    </div>

</div>


<script>

/*
==================================================
 GEMINI SETTINGS
==================================================
*/

// Модель Gemini.
// Если Google позже изменит доступные модели,
// это значение можно заменить.
const MODEL = "gemini-3.8-flash";

const API_URL =
    `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;


/*
==================================================
 ELEMENTS
==================================================
*/

const apiKeyInput = document.getElementById("apiKey");
const messageInput = document.getElementById("messageInput");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

const statusDot = document.getElementById("statusDot");
const statusText = document.getElementById("statusText");
const errorBox = document.getElementById("errorBox");


/*
==================================================
 CHAT HISTORY
==================================================
*/

let history = [];


/*
==================================================
 STATUS
==================================================
*/

function setStatus(online, text) {

    statusText.textContent = text;

    if (online) {
        statusDot.classList.add("online");
    } else {
        statusDot.classList.remove("online");
    }
}


/*
==================================================
 ERROR
==================================================
*/

function showError(message) {

    errorBox.innerHTML = `
        <div class="error">
            ⚠️ ${escapeHTML(message)}
        </div>
    `;
}

function clearError() {
    errorBox.innerHTML = "";
}


/*
==================================================
 ESCAPE HTML
==================================================
*/

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/*
==================================================
 ADD MESSAGE
==================================================
*/

function addMessage(text, type) {

    if (welcome) {
        welcome.remove();
    }

    const wrapper = document.createElement("div");

    wrapper.className =
        `message ${type}`;

    wrapper.innerHTML = `

        <div class="avatar">
            ${type === "user" ? "👤" : "✦"}
        </div>

        <div class="bubble">
            ${escapeHTML(text)}
        </div>

    `;

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
}


/*
==================================================
 TYPING
==================================================
*/

function addTyping() {

    const wrapper = document.createElement("div");

    wrapper.id = "typing";

    wrapper.className = "message";

    wrapper.innerHTML = `

        <div class="avatar">✦</div>

        <div class="bubble">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

    `;

    chat.appendChild(wrapper);

    chat.scrollTop = chat.scrollHeight;
}


function removeTyping() {

    const typing = document.getElementById("typing");

    if (typing) {
        typing.remove();
    }
}


/*
==================================================
 TEST API
==================================================
*/

async function testConnection() {

    clearError();

    const key = apiKeyInput.value.trim();

    if (!key) {

        showError("Сначала вставь Gemini API Key.");

        return;
    }

    setStatus(false, "Проверяю...");

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "x-goog-api-key": key
            },

            body: JSON.stringify({

                contents: [
                    {
                        parts: [
                            {
                                text:
                                    "Ответь одним словом: OK"
                            }
                        ]
                    }
                ]

            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                `HTTP ${response.status}`
            );

        }


        setStatus(true, "API работает ✓");

        addMessage(
            "API успешно отвечает. Ключ работает 🚀",
            "ai"
        );

    } catch (error) {

        setStatus(false, "Ошибка API");

        showError(error.message);

    }

}


/*
==================================================
 SEND MESSAGE
==================================================
*/

async function sendMessage() {

    clearError();

    const key = apiKeyInput.value.trim();

    const text = messageInput.value.trim();


    if (!key) {

        showError(
            "Вставь Gemini API Key сверху."
        );

        return;

    }


    if (!text) return;


    addMessage(text, "user");

    messageInput.value = "";

    addTyping();


    try {

        /*
        Добавляем сообщение пользователя
        в историю.
        */

        history.push({

            role: "user",

            parts: [
                {
                    text: text
                }
            ]

        });


        const response = await fetch(API_URL, {

            method: "POST",

            headers: {

                "Content-Type":
                    "application/json",

                "x-goog-api-key":
                    key

            },

            body: JSON.stringify({

                contents: history

            })

        });


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data?.error?.message ||
                `HTTP ${response.status}`
            );

        }


        const answer =
            data?.candidates?.[0]
                ?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();


        if (!answer) {

            throw new Error(
                "Gemini не вернул текстовый ответ."
            );

        }


        history.push({

            role: "model",

            parts: [
                {
                    text: answer
                }
            ]

        });


        removeTyping();

        addMessage(answer, "ai");

        setStatus(true, "API работает ✓");


    } catch (error) {

        removeTyping();

        showError(error.message);

        setStatus(false, "Ошибка API");

    }

}


/*
==================================================
 ENTER
==================================================
*/

function handleEnter(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        sendMessage();

    }

}


/*
==================================================
 CLEAR CHAT
==================================================
*/

function clearChat() {

    history = [];

    chat.innerHTML = `

        <div class="welcome" id="welcome">

            <div>

                <div class="welcomeIcon">
                    ✨
                </div>

                <h2>Чат очищен</h2>

                <p>
                    Можешь начать новый разговор.
                </p>

            </div>

        </div>

    `;

}


/*
==================================================
 DON'T SAVE API KEY
==================================================
*/

// Специально ничего не записываем
// в localStorage.

</script>

</body>
</html>
